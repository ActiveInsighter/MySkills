name: Prepare latest stable dependencies

on:
  push:
    branches: [chore/stable-stack-20261026]
    paths: [.github/workflows/prepare-stable-upgrade.yml]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Resolve latest published stable package versions
        run: |
          npx --yes npm-check-updates@latest -u --target latest
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependency tree
        run: npm ci --no-audit --no-fund
      - name: Run regression checks
        run: |
          npm test
          npm run typecheck
          npm run build
      - name: Commit tested version and lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "All declared packages already meet their stable dist-tags"
            exit 0
          fi
          git commit -m "chore(deps): upgrade to latest stable published versions"
          git push origin HEAD:chore/stable-stack-20261026
